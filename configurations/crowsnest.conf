#
################################################################################################

#####################################################################
####      Information about ports and according URL's           #####
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. Using any other port would involve       #####
####    changing the proxy configuration or using URLs          #####
####    with the specific port like                             #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
####    RTSP Stream URL: ( if enabled and supported )           #####
####    rtsp://<ip>:<rtsp_port>/stream.h264                     #####
#####################################################################

[crowsnest]
log_path: ~/printer_data/logs/crowsnest.log
log_level: debug        # Valid Options are quiet/verbose/debug
delete_log: true        # if set to true: Deletes log on every restart
no_proxy: false         # If set to true, no reverse proxy is required. Only change this, if you know what you are doing.


[cam eagleeye]
# --> See also: moonraker.conf
# Camera: print on board: DECXIN-5MAF-V1.1
# Manufacturer: ???
# Sensor Chip: OV569
# 5MP, 2k, minimum illumination: 0.5 lux
# Resolutions - MJPEG: 2592x1944 1920x1080 1280x720 960x540 800x480 640x480
# Framerate - MJPEG: all resolutions @ 30fps
# Resolutions & Framerate - YUV2: 2592x1944 @ 4fps, 1920x1080 @ 5fps, 1280x720 @ 9fps, 960x540 @ 15fps, 800x480 @ 18fps, 640x480 @ 30fps
# output image format: MJPEG/YUV2 (YUYV)
# connection: USB 2.0
# Features: Auto Exposure Control, Auto WHite Balance, Auto Gain Control
# Adjustable parameters: Brightness, Contrast, Color Saturation, Tintensity, Shaharpness, Gama White Balange, Backlight Contrast, Exposure Rating
# LED on board: ???
mode: camera-streamer 
    #mode: ustreamer                    # ustreamer - Provides mjpg and snapshots. more efficient than mjpg (All devices)
    #mode: mjpg                         # mjpg/rtsp (Eryone)
    #mode: camera-streamer              # camera-streamer - Provides WebRTC, mjpg and snapshots. In order to use WebRTC, please replace /webcam/?action=stream with webrtc (rpi + Raspi OS onyl)
                                        # https://crowsnest.mainsail.xyz/configuration/cam-section
enable_rtsp: false                      # If camera-streamer is used, this enables also usage of an rtsp server
rtsp_port: 8554                         # Set different ports for each device.
port: 8080                              # Streaming Port. HTTP/MJPG stream/snapshot port. Set different ports for each camera device!
                                        # Port 8080 equals /webcam/?action=[stream/snapshot] 
device: /dev/v4l/by-id/usb-Generic_DECXIN5M_200901010001-video-index0       # See crowsnest.log for available devices
resolution: 1920x1080                   # resolution (width x height).
    #resolution: 1280x720               # 2592x1944 - what the camera can provide
    #resolution: 960x540                # less cpu usage (setting by eryone)
    #resolution: 640x480
max_fps: 30                             # If Hardware Supports this it will be forced, otherwise ignored/coerced.
    #max_fps: 30                        # 30 fps - what the camera can provide
    #max_fps: 15                        # alternative
#custom_flags:                          # You can run the Stream Services with custom flags.
#v4l2ctl:                               # Add v4l2-ctl parameters to setup your camera, see Log what your cam is capable of.