   G1 X169.605 Y.309  

    ############################################
    # ::: Cleaning up :::
    M117 CLEAN_N: Claning up
 	M106 S0         # Turn off fan - Set fan speed: M106 S<value>
    M104 S0         # Turn off extruder heater

    ## move more close to bed
    ;M104 S150
    ;M109 S150
	#G1 Z0.06

    G1 Z10          # Lift nozzle to 10mm above bed
    G92 E0.0        # Reset extruder position to 0 --> re-zero the extruder counter
    M400            # Wait until all movements to finish

    ################################################################################################
    ################################################################################################
    # Home all axis to get rid of the Y axis "offset".
    G28


    ################################################################################################
    ################################################################################################   
    # ::: Done :::
    M117 End CLEAN_N