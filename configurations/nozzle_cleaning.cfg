   G1 X203.718  Y.309   E.02
   G1 X206.101  Y3.3    E.1
   G1 X205.565  Y3.3    E.02
   
    ############################################
    # ::: Finishing "Drawing Lines" :::
    M117 CLEAN_N: Finsihing - drawing lines

    ## Moving toolhead
    G1 X186.752 Y0.309       # Move toolhead to XY position. Without extruding
    
    G90
    G1 Z10                   # Lift nozzle to 10mm above bed (distance because nozzle is at print temperature)



    ################################################################################################
    ################################################################################################
    # Wiping (scratching) nozzle over pintbed
    ############################################
    # ::: Prepare: "Cleaning - Wipe (scratching) nozzle over printbed"
    M117 CLEAN_N: Prepare - Wiping nozzle (scratching)
    
    ## Cooling nozzle
    M117 CLEAN_N: Prepare - cleaning / scratching : Waiting for nozzle to reach new target temperature
    #M106 S230                      # Set fan speed: M106 S<value>
    M109 S140                       # Set extruder temperature and waits for temperature to settle at requested value  -  M109 [T<index>] S<temperature>. 

    ## Moving toolhead to scratching position.
    G90
    G1 Z10                  # Lift nozzle to 10mm above bed (distance because nozzle may still be at print temperature)
    G1 X179.25 Y3           # Move toolhead to XY position

    M400                            # Wait until all movements to finish
    G4 P4000
	RS_probe                        # Reset the Z probe piezzo sensor
    probe PROBE_SPEED=1.5           # Klipper probe command - Z axis probe action with download movement of 1.5mm/s. This is important to get the exact hight.
    SET_KINEMATIC_POSITION Z=0      # Tells klipper to treat current position as Z=0.
    M106 S0                         # Set fan speed: M106 S<value> - Turning the fan off.

    M117 CLEAN_N: Prepare - cleaning / scratiching - heating nozzle
    M109 S{nozzle_probing_temperature}          # Set Nozzle temperature

    ############################################
    # ::: Cleaning - Scratshcing :::
    M117 CLEAN_N: Wiping nozzle (scratching)
    # --> toolhead position is: X=100  Yreal=-0,905 (klipper thinks Y=3)

    # The following code scratches with nozzle over bed to clean it
