################################################################################################
# File: nozzle_cleaning.cfg
# Author: Eryone / Modified by Andreas
# Date: 202500109
# purpose: Nozzle cleaning
#
# include in printer.cfg
################################################################################################
# Content:
#   - Define / Get variables
#   - Preparation
#   - Extruding lines
#   - Drawing lines
#   - Cleaning - Scratching
#   - Cleanup
################################################################################################

[gcode_macro _CLEAN_N]
description: Cleaning the nozzle
gcode:
    ############################################
    ############################################
    # ::: Define / get variables :::

    # Where is it called and how?
    #   Call in [gcode_macro PRINT_START]:  CLEAN_N S={slicer_hotend_temperature_first_layer|float} X=100 Y=-3 A=0 D=0.4
    #   Call in [gcode_macro QUAD_GANTRY_LEVEL]:  CLEAN_N S=220 X=240 Y=-3 A=0
    
    # Parameters handed over:
    #   Call:  CLEAN_N S={slicer_hotend_temperature_first_layer|float} X=100 Y=-3 A=0 D=0.4
    {% set target_x_position = params.X|default(240)|float %}                           # = 100     # X axis starting point for cleaning process
    {% set target_y_position = params.Y|default(-3)|float %}                            # = -3      # Y axis starting point for cleaning process
    {% set y_safety_distance = params.A|default(0)|float %}                             # = 0       # Distance from the front and back edges of the bed where movement should stop.
    {% set nozzle_target_temperature_first_layer = params.S|default(220)|float %}       # variates, based in filament and slicer settings   # Nozzle target temperature for first layer
    {% set nozzle_diameter = params.D|default(0.4)|float %}                             # = 0.4     # Nozzle diameter   # Not used.
    
    # From variables.cfg file
    {% set nozzle_probing_temperature = (printer.save_variables.variables.andreas_nozzle_probing_temp|default(150))|int %}

    {% set target_x_position = 240 %}   # To move toolhead to where the actual cleaning takes place (by andreas)


    ################################################################################################
    ################################################################################################
    # ::: Preparation :::

    ############################################      
	# ::: Heating the nozle :::

    # (deactivated by andreas)
	#{% if params.S %}
    #    M117 CLEAN_N: Heating nozzle
	#    { action_respond_info("Heating extruder to %s C"%params.S) }
    #    {% if params.S|float > 250 %}
    #        M109 S230
    #    {% else %}
    #        M109 S{params.S}     # Set temperature and wait.                                                             # Does not make sense, because G28 Z reduces it to nozzle_probing_temperature
    #    {% endif %}
    #{% else %}                                                                                                          # added (by andreas)
    #    M117 CLEAN_N: params.S is missing! Nozzle will not heat up. Result: Error will occure                           # added (by andreas)
    #    { action_respond_info("CLEAN_N: params.S is missing! Nozzle will not heat up. Result: Error will occure") }     # added (by andreas)
    #{% endif %}

    ############################################      
	# ::: homing :::
    M117 CLEAN_N: Homing
    ;{% if 'xy' not in printer.toolhead.homed_axes %}
    ;   SET_KINEMATIC_POSITION Z=1
    ;   G1 Z3
    G28 X Y                 # Home X & Y axis
    ;{% endif %}
    ;SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z|default(100)|float-5}

    # Commented out (by andreas)
    #G90                     # Use absolute coordinates (G91 = relative)
    #G1 X395 Y3  F6000       # Move toolehad to XY position


    ################################################################################################
    ################################################################################################      
	# Posttioning logic
    ############################################
    M117 CLEAN_N: Posttioning logic:  Move toolhead -safely-
        # The code moves the toolhead safely within Y limits before moving to X, using A as a boundary offset from the bed edges.
    G90
    {% if params.Y and target_y_position <= y_safety_distance %}      # If target_y_position was handed over   &  target_y_position <= y_safety_distance
       G1 X{target_x_position} Y{y_safety_distance} F6000
       ; { action_respond_info("y %s  "%(y_safety_distance)) }
    {% elif params.Y and ptarget_y_position >= (printer.toolhead.axis_maximum.y|default(100)|float - y_safety_distance) %}     # Run when target_y_position is beyond the top limit of the bed (target_y_position >= (axis_minimum - y_safety_distance)
       G1 X{target_x_position} Y{printer.toolhead.axis_maximum.y|default(100)|float - y_safety_distance} F6000
       ;{ action_respond_info("yy %s  "%(printer.toolhead.axis_maximum.y|default(100)|float - y_safety_distance)) }
    {% else %}
	  G1 X{target_x_position} Y{params.Y|default('0')} F6000  
       ;{ action_respond_info("yyy %s  "%(target_y_position)) }
    {% endif %}

    G1 X{target_x_position} F6000
    # -->  Where can the toolehad be: X=100,  X=240  &  Y=0,  Y=400,  Y=-3
    # --> toolhead position is: X=100 Y=0

    G4 P1500
    M400

    ############################################      
	# ::: home Z where it is.:::
    # deactivated beyaus it is done below with probe PROBE_SPEED=1.5 (by andreas)
    #M117 CLEAN_N: Posttioning logic: home Z axis at current position - G28 N
    #G28 N      # G28 N - Homes the nozzle at its current postition (Z axis only). No movement of the toolhead to the middle of the bed. Not Klipper standard.

    ############################################
    M117 CLEAN_N: Positioning logic: Define Y offset and manipulate klipper.
        # This allows to move the toolhead to position below Y axis 0. In if-case-1 it acutally moves the toolhead into negative position.
 	;SET_KINEMATIC_POSITION X=240
	G90
    {% if params.Y and target_y_position < 0 %}                            # target_y_position < 0
	    G1 Y0 F6000	                                                    # Move Toolhead to Y=0
	    SET_KINEMATIC_POSITION Y={0.905-params.Y|default('0')|int}      # re-labels the current position. Klipper thinks that the toolhead is at Y=3.905 (=0,905--3 = 0,905+3) instead of Yreal=0.
	    G1 Y0.905 F6000                                                 # Move toolhead to pysical position Yreal=-3. Without disabling soft limits.
	{% elif params.Y and target_y_position > (printer.toolhead.axis_maximum.y|default(100)|float - 3) %}   # target_y_position > (397 = 400 -3)
	    G1 Y{params.Y|default('0')} F6000
	    SET_KINEMATIC_POSITION Y=0.905          
	{% else %}
	    G1 Y{params.Y|default('0')} F6000
	    SET_KINEMATIC_POSITION Y=0.905
	{% endif %}
    # -->  Where can the toolehad be: X=100,  X=240  &  Y=0,  Y=-3,  Y=-3error
    # --> toolhead position is: X=100  Yreal=-3 (klipper thinks Y=0.905)


    ################################################################################################
    ################################################################################################
    # Extruding Lines
    ############################################
    # ::: Prepare: "Extruding lines" :::

    ############################################
    M117 CLEAN_N: Re-Define bed level at current position a Z=0

    G90 
    G1 X{target_x_position}                         # Move toolhead to x=240 where actual cleaning takes place.  # The above defined x=100 does not make sens for probing because it is way off where the cleaning takes place.
    G90
    G1 Z3                           # Lift to ensure that probe is not touching the bed.
    G4 P1500
    
    RS_probe                        # Calls gcode_macro to reset Z probe        # ??? Is also done in HOME_Z macro
    probe PROBE_SPEED=1.5           # Klipper probe command - Z axis probes at current position with movement speed of 1.5mm/s
                                    # Probe at current position (only Z axis). No nozzle lift. Nozzle stays at bed.
    SET_KINEMATIC_POSITION Z=0      # Tells klipper to treat current position as Z=0.
    
    G90
    G1 Z3                           # Move nozzle to 3mm above bed

    ############################################
    M117 CLEAN_N: Prepare - extruding lines

    #{% if params.S %}
    #     M117 Heating
 	#    { action_respond_info("Heating extruder to %s C"%params.S) }
 	#    M109 S{params.S}
 	#{% endif %}

    G90
    G1 Z3                           # Move nozzle to 3mm above bed
    G1 X{target_x_position}                        # Move toolhead to x=240
	G92 E0.0                        # Reset extruder position to 0 --> re-zero the extruder counter
    
    M109 S{nozzle_target_temperature_first_layer}

    ############################################
    ## ::: Extruding lines :::
    M117 CLEAN_N: Extruding lines
    # --> toolhead position is: X=242  Yreal=-3 (klipper thinks Y=0.905)

	G90                     # G90 - Use absolute coordinates (G91 = relative)
	#G1 Z.2 G1 E3           # ??? !!! G1 Z.2 is executed. G1 E3 is ignored  # wirtten (by eryone) - commented out (by andreas)
    G1                  Z0.2                      # move nozzle to 0.2mm above bed    # added (by andreas)
  	M83                                          # Relative distances for extrusion. (M82 = absolute)
    G1                          E3               # Extrude
	G92                         E0.0             # Reset extruder position to 0 --> re-zero the extruder counter
    G1 X280.0                   E3.0    F600     # G1 - Move: G1 [X<pos>] [Y<pos>] [Z<pos>] [E<pos>] [F<speed>]
	G1 X265.0   Y3              E3.0  
	G1 X250.0   Y0.2            E1.0  
    G1 X280.0                   E1.0  
	G1 X265.0   Y3              E2.0  
	G1 X259.0   Y0.2            E2.0 
    G1 X280.0   Y0              E3.0

    
    ################################################################################################
    ################################################################################################
    # Drawing lines
    ############################################
    # ::: Prepare: "Drawing lines" :::
    M117 CLEAN_N: Prepare - drawing lines
    G1                  Z2                          # Lift bozzle to 2mm above bed
    G92                         E0.0                # Reset extruder position to 0 --> re-zero the extruder counter
    G1          Y8                      F6000
    G1 X237                             F6000
    G1 X237     Y2                                  # ??? !!! X237 is given in above G1. Why again ?
    G1                  Z0.2                         # Lower nozzle 0,2mm above bed
    
	## infill move
	;G1 X208.978    Y18.134     E.6     F6000
	;G1                         E.6     F1800
    ;G1                                 F900        # Setting move speed
    ;G1             Y.905
    ;M104 S150                                      # heating
    ;G1 X280                    E8
    ;G1             Y1.905
    ;G1 X239.265                E8

	G1 F1350        # Setting move speed
    ;M104 S150      # heating

    M117 CLEAN_N: Prepare - drawing lines - heating nozzle
    M109 S{nozzle_target_temperature_first_layer}

   ############################################
   # ::: Drawing lines :::
   M117 CLEAN_N: Drawing lines
    # --> toolhead position is: X=237  Yreal=--1,905 (klipper thinks Y=2)

   G1 X237.121  Y.309   E2
