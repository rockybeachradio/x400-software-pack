#
# KlippeScreen is launched via Linux Service: KlipperScreen.service
# moonraker.cfg: The IP of the client, on which KlipperScreen runs, must be added to the -authorization- turested_clients section.
# printer.cfg: the following need to be activated/configured:
#	-virtual_sdcard-
#	-display_status-
#	-pause_resume-
# moonraker update_manager can be used. See moonraker.cfg
#
# KIAUH installation:
#   The KlipperScreen.conf is located in /printer_data/config/ folder.
#   There is no KlipperScreen.conf in the /KlipperScreen/config/ folder.
#
#
# IMPORTANT: In the comments no square brackets allowed. Instead I use - (minus)
#
