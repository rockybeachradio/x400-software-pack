######################################################
[gcode_macro _homing_override_v1]
    # homing_override takes over the full controll of homing. So this is needed to call teh homing routines. Here custom honing gcode_macros
    # reference: https://github.com/EricZimmerman/Voron24/blob/PreKlippain/macros/helpers/homing.cfg

    # ??? !!! Alternative (mybe better) way to home. Without set_position_z
    #   https://github.com/Frix-x/klippain/blob/main/macros/base/homing/homing_override.cfg
    # ??? !!! Voron is unsing:  SET_KINEMATIC_POSITION Z=1 SET_HOMED=Z
    #   https://github.com/EricZimmerman/Voron24/blob/PreKlippain/macros/helpers/homing.cfg

#axes: xyz               # Defines which axes this custom homing override(s) applies to.
                        # For example, if this is set to "z" then the override script will only be run when the z axis is homed (eg, via a "G28" or "G28 Z0" command).
                        # Note, the override script should still home all axes.
                        # The default is "xyz" which causes the override script to be run in place of all G28 commands.
#set_position_z: 0      # If specified, the printer will assume the axis is at the specified position prior to running the g-code commands.
                        # Setting this disables homing checks for that axis. This may be useful if the head must move prior to invoking the normal G28 mechanism for an axis.
                        # The default is to not force a position for an axis.
gcode:
    # Define variables    
        {% set home_all = 'x' not in params|lower and 'y' not in params|lower and 'z' not in params|lower and 'n' not in params|lower %}   # If G28 was called, without parameters, then: home_all == True
                 # {% set home_all = (params|length == 0) %}    # Not working. Because G28 always handes over params = {'G': '28'}
        {% set home_all = 'x' not in printer.toolhead.homed_axes|lower or 'y' not in printer.toolhead.homed_axes|lower %}       # if x or y axis are not homed: home_all == True  -  Why? Because Z is set to homed, even if it is not homed. "set_postiion_z: 0" (by andreas)

    # Debuging: Print variables
        {% set homing_parameters = params %}

        {action_respond_info("G28 handed over params = " ~ params|string)}
        {action_respond_info("homing_parameters = %s "%homing_parameters)}
        {action_respond_info("home_all = " ~ home_all)}
        {action_respond_info("printer.toolhead.homed_axes = " ~ printer.toolhead.homed_axes)}

        {% if 'x' not in printer.toolhead.homed_axes|lower %}
            { action_respond_info("x axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("x axis is in printer.toolhead.homed_axes") }
        {% endif %}
        {% if 'y' not in printer.toolhead.homed_axes %}
            { action_respond_info("y axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("y axis is in printer.toolhead.homed_axes") }
        {% endif %}
        {% if 'z' not in printer.toolhead.homed_axes %}
            { action_respond_info("z axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("z axis is in printer.toolhead.homed_axes") }
        {% endif %}
        {% if 'e' not in printer.toolhead.homed_axes %}
            { action_respond_info("e axis not in printer.toolhead.homed_axes") }
        {% else %}
            { action_respond_info("e axis is in printer.toolhead.homed_axes") }
        {% endif %}
        { action_respond_info("-") }


    M400    # M400 - wait to finish all pending moves/process the buffer

    QUERY_PROBE         # Refresh probe state
    QUERY_ENDSTOPS      # Refresh endstop states
        # M118 X: {printer['query_endstops'].last_query['stepper_x']}  ; 0 or 1
        # M118 Y: {printer['query_endstops'].last_query['stepper_y']}  ; 0 or 1
        # M118 Z: {printer['query_endstops'].last_query['stepper_z']}  ; 0 or 1
    {% if printer.probe.last_query == 1 or printer['query_endstops'].last_query['stepper_z'] == 1 or ('x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes) %}
        # Z is shown as homed due to "set_position_z: 0". So this complex workarround is needed.

        #{% if 'x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes  %}
        #{% if 'z' not in printer.toolhead.homed_axes|lower %}   # If Z not homed
        #{ action_respond_info("z not in printer.toolhead.homed_axes: Lifting Z by 5mm") }
        #SET_KINEMATIC_POSITION Z=1 SET_HOMED=Z     # Tells Klipper that the toolhead is vurrently on Z=0.
        # Lift the nozzle for safety reasons. "SET_KINEMATIC_POSITION Z=0" ist set above "gcode:". As result the toolhead can be moved. When the nozzle is touching the bed an X or Y movement is nititated, the bed will be scratched. Or wors.
        
        M117 Lifting Z by 3mm
        { action_respond_info("Lifting Z by 3mm") }
        M400
        G91                             # Puts printer into relative positoning mode. All movenete commands are relative to the current position. (oposite of G90)
        G1 Z3 F1000                     # Lift Z by 5mm. For saftey that it does not scratch the print bed.
        G90                             # Puts printer into absoulute positioning mode. All movements commands are from the origin. (oposite of G91)

        M117 Call: reset_probe_adc
        { action_respond_info("Call: reset_probe_adc") }
        M400
        reset_probe_adc     # Call macro to reset z-nozzle probe chip

        #SET_KINEMATIC_POSITION Z=0     # Set the new, higher Z position as new Z=0. So the nozzle can not go below Z5 and hit the bed.
        #SET_HOMED_AXES AXES=
    #{% elif 'z' in printer.toolhead.homed_axes|lower %}     # if Z homed
    #    G90
    #    G1 Z5 F1000     # Move nozzle 5mm above bed.  # Not good, when PLR restart is executed.
    {% endif %}    

    M400

    {% if home_all or 'x' in params|lower %}      # if G28 X was called
        M117 Homing X
        { action_respond_info("Homing X") }

        # Defines the amount of current during homing
        {% set HOMING_STEPPER_XY_RUN_CURRENT = (printer.save_variables.variables.andreas_homing_stepper_xy_run_current|default(0.49))|float %}

        # Get actual current settings for stepper motors
        {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
        {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}

        # Reduce current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
    
        M400
        G28 X       # homes X

        G91             # Set to relative mode
        G1 X-15 F1200   # Move toolhead away from enstop switch when finished to remove stress from the mechanic
        G90

        # Set back current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    {% endif %}
  
    M400

    {% if home_all or 'y' in params|lower %}
        M117 Homing Y
        { action_respond_info("Homing Y") }

        # Defines the amount of current during homing
        {% set HOMING_STEPPER_XY_RUN_CURRENT = (printer.save_variables.variables.andreas_homing_stepper_xy_run_current|default(0.49))|float %}

        # Get actual current settings for stepper motors
        {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
        {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}

        # Reduce current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOMING_STEPPER_XY_RUN_CURRENT}
    
        M400
        G28 Y       # homes Y

        G91             # Set to relative mode
        G1 Y-15 F1200   # Move toolhead away from enstop switch when finished to remove stress from the mechanic
        G90

        # Set back current on Stepper-Motors
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    {% endif %}
  
    M400

    {% if home_all or 'z' in params|lower %}
        M117 Homing Z
        { action_respond_info("Homing Z") }

        # stepper motor run_current reduction is done in [probe] section
        # Nozzle temperature is set in [probe]
        
        M400
        G90         # Set to absolute mode
        G1 X200 Y200 F6000
        
        RS_probe    # calls the macro RS_Probe

        M400
        G28 Z

        G90             # Set to absolute mode
        G1 Z5 F1200     # Lift Toolhead to 5mm above the print bed to remove stress from zhe piezzo element
    {% endif %}

    M400
    {% if 'n' in params|lower %}
        # Command: G28 N - Homes the nozzle at its current postition (Z axis only). No movement of the toolhead to the middle of the bed.
        # "G28 N" is called in printjob_mgmt.cfg [gcode_macro _CLEAN_N]
        M117 Homing G28 N
        { action_respond_info("Homing G28 N") }
        {% if 'xy' not in printer.toolhead.homed_axes  %}       # If not homed on X and Y
            { action_respond_info("Homing XY first") }
        {% else %}
            { action_respond_info("Homing Z at current position") }
            M400
            RS_probe
            M400
            G28 Z
            G90
            G1 Z5 F1200        # Lift Toolhead to 5mm above the print bed to remove stress from zhe piezzo element
        {% endif %}
    {% endif %}
