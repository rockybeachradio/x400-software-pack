[gcode_macro UNLOAD_FILAMENT_OLD]
description: Unload Filament
  # KlipperScreen Macro is different: https://klipperscreen.readthedocs.io/en/latest/macros/
  # ??? !!! Alternatvie to check and incorporate: https://github.com/Frix-x/klippain/blob/main/macros/helpers/filament_swap.cfg
gcode:
  ################################
  # ::: Define variables :::
  {% set NOZZLE_TEMP = params.NOZZLE_TEMP|default(220)|float %}
  {% set SPEED       = params.SPEED|default(0)|int %}
  {% set MODE        = params.MODE|default("AUTO")|string %}  # START, RUNOUTDETECTION, AUTO. [runout]-insert_gcode: ruf dies mit RUNOUTDETECTION auf.
    # Decide whether homing is allowed:
    # - MODE=START: allow homing (start-of-print prep)
    # - MODE=RUNOUTDETECTION: never home (mid-print runout recovery)
    # - MODE=AUTO: allow homing only if not printing yet. Default: AUTO (if no parameter was handed over)
  {% set allow_home = (
        (MODE == "START") or
        (MODE == "AUTO" and printer.print_stats.state not in ["printing", "paused"])
    ) %}

  { action_respond_info("nozzle TEMPERATURE %s "%NOZZLE_TEMP) }
  { action_respond_info("Unload Filament printing %d" % ( params.SPEED|default(0)|int )) }

  ################################
  # ::: Check ::: 
  {% if printer['filament_switch_sensor toolhead_filament_sensor'].filament_detected %}   # Check if filemant snsor detected a filament.

    M117 Filament detected. Starting the unload process.
    { action_respond_info("Filament detected. Starting the unload process.") }
    _status_bar PS="progress"
  
    {% if printer.pause_resume.is_paused == False and params.SPEED|default(0)|int == 0 %}     
      { action_respond_info("pausing") }
      PAUSE       # Calls the Klipper PAUSE macro
      G4 P1000
      ;SET_IDLE_TIMEOUT TIMEOUT=864000    # Witing for one day (in seconds)
    {% endif %}  

    {% if 'xy' not in printer.toolhead.homed_axes or printer.toolhead.position.x==395  %}   # When in mid Print, axis should be homed. During Print start, nothing is homed at the point of PAUSE.
      M117 UNLOAD_FILAMENT: Homing needed. Calling G28 X Y
      { action_respond_info("UNLOAD_FILAMENT: Homing needed. Calling: G28 X Y") }
      G28 X Y                                                             # If X or Y not homed, all axis X,Y,Z will be homed. Even if G28 X Y is called.
      { action_respond_info("z%f " %  printer.toolhead.position.z) }
      {% if 'z' not in printer.toolhead.homed_axes %}                     # As soon as G28 X Y is axecuted, z is assuemd as homed due to "set_position_z:0" in [homing_override]
        SET_KINEMATIC_POSITION Z={ printer.toolhead.position.z }          # If this is done (without Z homing, like in eryones code) the toolhead might end up on the bed or up in the air.
      {% endif %}
    {% endif %}

    SAVE_GCODE_STATE NAME=unload_filament

    ################################
    # ::: Unload process ::: 
    M104 S{NOZZLE_TEMP}   # Set nozzle temperature to safe time later at M109 command.

    M117 UNLOAD_FILAMENT: Move toolhead
    G90
    G1 X0 Y50 Z10 F3600    # move toolhead to pruging position

    #{% if printer[printer.toolhead.extruder].target < 190 or printer[printer.toolhead.extruder].temperature + 3 < printer[printer.toolhead.extruder].target  %}
      M117 UNLOAD_FILAMENT: Heating nozzle
      M109 S{NOZZLE_TEMP}
    #{% endif %}   

    # Extruder rotation to unload
    G91                   # Use relative coordinates for move commands
    M83                   # Put the extruder into relative mode
    G92 E0.0              # Set position pf extruder to 0 - Tell Klipper taht the current position of the extruder is 0.

    M117 UNLOAD_FILAMENT: Prepare forming tip on filament
    G0 E-5 F2000          # extract a bit
    G0 E5 F300            # move filament back in
      
    G0 E-30 F3000         # forming filament Tip for Rapido -> from ERCF V3 ercf_software.cfg
  
    M117 UNLOAD_FILAMENT: Forming tip on filament
    G0 E2 F300            # Move filament in
    G0 E-2 F300           # Move filament out
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
      
    M117 UNLOAD_FILAMENT: Unloading filament
    G0 E-40 F1800         # Puke filament out fast

    G92 E0.0              # Set position of extruder to 0
    M82                   # Put the extruder into absolute mode.
    G90                   # Use absolute coordinates for move commands

    # PReventing filament sticking to the nozzle.
    M104 S0     # Turn off nozzle heater
    M106 S127   # Use part cooling to harden the material. Not 255=100% because filament drys too fast.
    G4 P5000    # Wait 5 seconds
    M107        # Stop part cooling fan
    G1 Z{poop_height_z + ooze_offset_z - 10}

    RESTORE_GCODE_STATE NAME=unload_filament MOVE=0

    M117 UNLOAD_FILAMENT: Complete. Filament can now be removed.

  {% else %}
    M117 No filament detected. Nothing to unload.
    { action_respond_info("No filament detected. Nothing to unload.") }
  {% endif %}
  _status_bar PS="idle"
