# Video: https://www.youtube.com/watch?v=U1onfGroUJI
# GitHub https://github.com/scheffield/nozzle-cleaner
# PRINT_START macor: https://github.com/scheffield/nozzle-cleaner/tree/main
# Purge bucket: https://youtu.be/U1onfGroUJI?si=wYQkQs2K9sNtaFae&t=162
# original mod: https://github.com/VoronDesign/VoronUsers/tree/main/orphaned_mods/edwardyeeks/Decontaminator_Purge_Bucket_%26_Nozzle_Scrubber


# The macro can also be called from the command line for testing like so:
#   clean_nozzle PURGE=215 CLEAN=150 # Go to purge bucket, heat to target temp, purge, cool to 150, wipe nozzle
#   clean_nozzle PURGE=215           # Go to purge bucket, heat to target temp, purge, wipe nozzle
#   clean_nozzle                     # Go to purge bucket, wipe nozzle


[gcode_macro _CLEAN_NOZZLE_2]
description: Cleaning the nozzle BambuLab style

# These parameters define your filament purging.
# The retract variable is used to retract right after purging to prevent unnecessary oozing.
# Some filament are particularly oozy and may continue to ooze out of the nozzle for a second or two after retracting. The ooze dwell variable makes allowance for this.
# If you decided to not enable purge, you can ignore this section.
variable_purge_len:            10          ; Amount of filament, in mm, to purge.
variable_purge_spd:           200          ; Speed, in mm/min, of the purge.
variable_purge_temp_min:      150          ; Minimum nozzle temperature to permit a purge. Otherwise, purge will not occur.
variable_purge_ret:             2          ; Retract length, in mm, after purging to prevent slight oozing. Adjust as necessary.
variable_ooze_offset_z:        40          ; After purging, how far up to move Z, in mm.
variable_ooze_spd_z:          120          ; After purging, how fast to move up Z, in mm/min.

# Adjust this so that your nozzle hits the tube. The nozzle should hit the upper 1/4th to 1/2nd part of the tube.
variable_tube_top:              4.5        ; Z position in mm

# These parameters define your cleaning, travel speeds, safe z clearance and how many times you want to wipe.
# Wipe direction is randomized based off whether the left or right bucket is randomly selected in the purge & scrubbing routine.
variable_clearance_z:           5          ; When traveling, but not cleaning, the clearance along the z-axis between nozzle and tube.
variable_wipe_qty:              2          ; Number of complete (A complete wipe: left, right, left OR right, left, right) wipes.
variable_prep_spd_xy:        6000          ; Travel (not cleaning) speed along x and y-axis in mm/min.
variable_prep_spd_z:         1500          ; Travel (not cleaning) speed along z axis in mm/min.
variable_wipe_spd_xy:        5000          ; Nozzle wipe speed in mm/min.

# Tube position
variable_tube_x:              110 # X position of tube, Y is assumed to be 0

# This value is defaulted from tube location in CAD (rear left).
variable_wipe_travel:          20 # distance to travel when claening in mm      

# These parameters define the size of your purge bucket.
# If you decided to not enable purge, you can ignore this section. A visual reference is provided below.
# 
#                                     bucket_gap
#                                      ← ---- →
#                     __________________________________________
#                    |                 |      |                 |      
#                    |                 |      |                 |
#  bucket_start (x)  |                 |______|                 |
#                    |                 |      |                 |
#                    |                 |      |                 |
#                    |_________________|. . . |_________________|
#                     ← ------------- →        ← ------------- →
#                     bucket_left_width        bucket_right_width
#  _______________________________________________________________________________________
#                                    PRINTER FRONT
# 
## For V2.4 250mm build, uncomment below 
#variable_bucket_left_width:    42

## For V2.4 300mm build, uncomment below
#variable_bucket_left_width:    67

## For V2.4 350mm build, uncomment below
variable_bucket_left_width:    92   

# These values are defaulted from bucket geometry in CAD (rear left location). Change only if you're using a custom bucket.
variable_bucket_right_width:   40            
variable_bucket_gap:           22

# For V1.8, you may need to measure where your bucket start is and input into bucket_start. Otherwise, a value of 0 is for a default
# installation of purge bucket at rear left.
variable_bucket_start: 0

# Placeholder. The variable will later be set to contain, at random, a number representing the left or right bucket.
variable_bucket_pos:            1

gcode:
    % set purge_temp = params.PURGE|default("0")|int %}         # Temperature in °C at which the filament is extruded/purged. Should be the print temperature. If no temperature or below 150 °C is specified, no purging will happen.
    {% set clean_temp = params.CLEAN|default("0")|int %}        # Temperature in °C below which the nozzle is whiped over the tube. If not termperature is defined, the cleaning will happen without waiting to reach any particular temperature.

    {% if "xyz" in printer.toolhead.homed_axes %}       # First, check if the axes are homed.
        SAVE_GCODE_STATE NAME=clean_nozzle              # Save the gcode state in this macro instance.
        G90                                             # Set to absolute positioning.
        SET_DISPLAY_TEXT MSG="Cleaning nozzle"          ; Displays info
  
        {% set Ry = printer.configfile.config["stepper_y"]["position_max"]|float %}                 # Grab max position of Y-axis from config to use in setting a fixed y position.
        SET_GCODE_VARIABLE MACRO=clean_nozzle VARIABLE=bucket_pos VALUE={(range(2) | random)}       # Randomly select left or right bin for purge. 0 = left, 1 = right
        G1 Z{tube_top + clearance_z} F{prep_spd_z}      # Raise Z for travel.
        
        # Position for purge. Randomly selects middle of left or right bucket. It references from the middle of the left bucket.
        G1 Y{Ry} F{prep_spd_xy}
        G1 X{bucket_start + (bucket_left_width / (2 - bucket_pos)) + (bucket_pos * bucket_gap) + (bucket_pos * (bucket_right_width / 2))}
  

        {% if purge_temp > purge_temp_min %}        # Purge filament if temp above 150 °C is specified
            G1 Z{tube_top} F{prep_spd_z}            # Lower as far as we can go
            # Heats up the nozzle up to target via data from slicer
            SET_DISPLAY_TEXT MSG="Hotend: {purge_temp}c"  ; Displays info
            STATUS_HEATING                                ; Sets SB-leds to heating-mode
            M107                                          ; Turns off partcooling fan
            M109 S{purge_temp}                            ; Heats the nozzle to printing temp
      
            ### Small retract after purging to minimize any persistent oozing at 5x purge_spd. G4 dwell is in milliseconds,
            ### hence * 1000 in formula.
            M83        ; relative mode
            G1 E{purge_len} F{purge_spd}
            G1 E-{purge_ret} F{purge_spd * 5}
            M106 S127  ; use part cooling to harden the material
            G92 E0     ; reset extruder
        {% endif %}
  
        # Wait till hotend is below given temperature if provided
        {% if clean_temp > 0 %}
            # Cooling nozzle to a given temperature. This helps with cleanly breaking off extruded filament
            SET_DISPLAY_TEXT MSG="Hotend: {clean_temp}c"  ; Displays info
            M104 S{clean_temp}                            ; Heats the nozzle to 150c without waiting
            G1 Z{tube_top + ooze_offset_z} F{ooze_spd_z}  ; Slowly moving up to ensure ooze is straight and can be broken off
            M109 S{clean_temp}                            ; Actually waiting for temperature to reach
            M107                                          ; stop part cooling fan
        {% endif %}
  
        # Position for wipe. Either left or right of tube based off bucket_pos to avoid unnecessary travel.
        G1 Z{tube_top + clearance_z} F{prep_spd_z}
        G1 X{tube_x + (wipe_travel / 2 * (bucket_pos * 2 - 1))} F{prep_spd_xy}
        G1 Y{Ry}
  
        # Move nozzle down to hit the tube.
        G1 Z{tube_top} F{prep_spd_z}
  
        # Perform wipe. Wipe direction based off bucket_pos for cool random scrubby routine.
        {% for wipes in range(1, (wipe_qty + 1)) %}
            G1 X{tube_x - (wipe_travel / 2 * (bucket_pos * 2 - 1))} F{wipe_spd_xy}
            G1 X{tube_x + (wipe_travel / 2 * (bucket_pos * 2 - 1))} F{wipe_spd_xy}
        {% endfor %}
  
        # Clear from area.
        SET_DISPLAY_TEXT MSG="Nozzle cleaned"
        G1 Z{tube_top + clearance_z} F{prep_spd_z}
        G1 X{bucket_start + (bucket_left_width / 4)} F{prep_spd_xy} #bugfix for right side mounted buckets

        # Restore the gcode state to how it was before the macro.
        RESTORE_GCODE_STATE NAME=clean_nozzle
       
    {% else %}
        # raise error will stop any macros that clean_nozzle is referenced in from proceeding for safety.
        { action_raise_error("Please home your axes!") }
        SET_DISPLAY_TEXT MSG="Please home first!"
    {% endif %}