################################################################################################
# Calibration Values. Creation can be trickered via console. Also saving them.
#
# Section description:
#   probe:      Providing an accurate probe z_offset is critical to obtaining high quality prints. --> For better first layer.
#               z_offset is the distance between the nozzle and bed when the probe triggers.
#               PROBE is used instead of: position_endstop = z_offset
#               The z_offset is commented out [probe] in EECAN.cfg, because it is definde in printer.cfg
#               Thinker has a PZ-Probe in the nozzle. So z_offset = 0. 
#               HowTo calibrate the z_offset: DrKlipper https://youtu.be/nqGv3xfeXKA?si=vwlziyj7Z5ngQBO9&t=918
#               z_offset = -0.12 (by Eryone)
#               https://www.klipper3d.org/Probe_Calibrate.html
#
#   bed_mesh default:   Measures the Bed on different places.
#                       Settings for bed_mesh are defined in the accoriding section in calibration.cfg
#                       HowTo calibrate bed_mesh: DrKlipper https://youtu.be/nqGv3xfeXKA?si=6VmfRt51Oc-s0ZJ0&t=2029
#                       Home axis: $ G28
#                       Z-TIlT oder quad_gentry_level ausführen
#                       HEat up bed to "printing" temperature. eg. for PLA
#                       Calibration: $ BED_MESH_CALIBRATE
#                       Store mesh profile for certain filament (eg. PLA): $ BED_MESH:PROFILE SAVE=Mesh_PLA
#                       Store mesh profile as default: $ SAVE_CONFIG 
#
#   input_shaper:   Durckerbewegungen kompensieren
#                   The values are commented out in the accoriding section in calibration.cfg
#                   HowTo calibrate the z_offset: DrKlipper https://youtu.be/nqGv3xfeXKA?si=1HtclaiYY_JHlxni&t=2344
#                   Home axis: $ G28
#                   Execute the calibration: $ SHAPER_CALIBRATE
#                   Store the values: $ SAVE_CONFIG
#
#   extruder:  Extruder temperature calibration. Via temrinal commands.
#              The values are commented out in the accoriding section in EECAN.cfg
#              HowTo calibrate the PID values: DrKlipper https://youtu.be/nqGv3xfeXKA?si=lBENN1wxQI_1K4cl&t=461
#              Printer/Extruder should have room temperature. Select a target temperature of the nozzle temperature usually used to print.
#              Execute the calibration: $ PID_CALIBRATE HEATER=extruder TARGET=230
#              Store the values: $ SAVE_CONFIG
#
#   heater_bed: Heatbed temepratue calibration. Via terminal commands.
#               The values are commented out in the accoriding section in x400.cfg
#               HowTo calibrate the PID values: DrKlipper https://youtu.be/nqGv3xfeXKA?si=Iy7UHeuTcOsjQzWX&t=629
#               Printer/heat_bed should have room temperature. Select a target temperature of the nozzle temperature usually used to print.
#               Execute the calibration: $ PID_CALIBRATE HEATER=heater_bed TARGET=60
#               Store the values: $ SAVE_CONFIG
#
#   heater_generic chamber_heater:
#              There is a gcode_macro CALIBRATE_CHAMBER_PID in calibrate.cfg to calibrate hte chamber_heater
#
#               :::: How it can be one manually :::
#               PID values should be determined via klipper command:
#                   $ PID_CALIBRATE HEATER=chamber_heater TARGET=50
#                   $ SAVE_CONFIG
#                   --> Klipper stores the values in printer.cfg at the bottom.
#              PID Values:
#                   pid_Kp = 20-0              # Proportional - Reagiert direkt proportional zum Temperaturfehler (Soll − Ist). Je größer der Fehler, desto stärker die Heizleistung. Hoher Wert → reagiert aggressiver, erreicht Soll schneller, kann aber auch stärker überschwingen.
#                   pid_ki = 0.5               # Integral - Summiert den Fehler über die Zeit auf und korrigiert kleine Abweichungen. Verhindert, dass die Temperatur dauerhaft knapp unter dem Soll bleibt. Zu hoch → kann schwingen; zu niedrig → braucht länger, um Abweichungen auszugleichen.
#                   pid_kd = 50.0              # Derivative -Reagiert auf die Änderungsgeschwindigkeit der Temperatur. Bremst die Regelung, wenn sich die Temperatur zu schnell ändert, um Überschwingen zu vermeiden. Hoher Wert → stabilisiert, aber zu hoch → kann das System träge machen.
#              Klipper evaluates the PID settings with the following general formula: fan_pwm = max_power - (Kp*e + Ki*integral(e) - Kd*derivative(e)) / 255
#              Where "e" is "target_temperature - measured_temperature" and "fan_pwm" is the requested fan rate with 0.0 being full off and 1.0 being full on.
#
#   temperature_fan chamber_exhaust_fan:
#               Currently set as Watermark. So no PID is required
#
#               :::: How it can be one manually :::
#               PID values should be determined via klipper command:
#                   $ PID_CALIBRATE HEATER=chamber_heater TARGET=50
#                   $ SAVE_CONFIG
#                   --> Klipper stores the values in printer.cfg at the bottom.
#               PID Values:
#                   pid_Kp = 20-0              # Proportional - Reagiert direkt proportional zum Temperaturfehler (Soll − Ist). Je größer der Fehler, desto stärker die Heizleistung. Hoher Wert → reagiert aggressiver, erreicht Soll schneller, kann aber auch stärker überschwingen.
#                   pid_ki = 0.5               # Integral - Summiert den Fehler über die Zeit auf und korrigiert kleine Abweichungen. Verhindert, dass die Temperatur dauerhaft knapp unter dem Soll bleibt. Zu hoch → kann schwingen; zu niedrig → braucht länger, um Abweichungen auszugleichen.
#                   pid_kd = 50.0              # Derivative -Reagiert auf die Änderungsgeschwindigkeit der Temperatur. Bremst die Regelung, wenn sich die Temperatur zu schnell ändert, um Überschwingen zu vermeiden. Hoher Wert → stabilisiert, aber zu hoch → kann das System träge machen.
#                   pid_deriv_time: 2.0             # A time value (in seconds) over which temperature measurements will be smoothed when using the PID control algorithm. This may reduce the impact of measurement noise. The default is 2 seconds.
#               Klipper evaluates the PID settings with the following general formula: fan_pwm = max_power - (Kp*e + Ki*integral(e) - Kd*derivative(e)) / 255
#               Where "e" is "target_temperature - measured_temperature" and "fan_pwm" is the requested fan rate with 0.0 being full off and 1.0 being full on.
#
#
# Other Calibrations:
#   [endstop_phase]
#       Calbration of the endstops, that they are more acurate.
#       Calibraiton of the endstop_phase: DrKlipper https://youtu.be/nqGv3xfeXKA?si=0igMmOukUWeSeZ0e&t=695
#       $ endstop_hase_calibrate
#
################################################################################################

