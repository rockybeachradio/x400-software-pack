################################################################################################
# MOVE_UP
################################################################################################
[gcode_macro MOVE_UP]
# source: https://www.klipper3d.org/Command_Templates.html
gcode:
  SAVE_GCODE_STATE NAME=my_move_up_state
  G91
  G1 Z10 F300
  RESTORE_GCODE_STATE NAME=my_move_up_state #  G-Code parsing state 


####################################################################
# Printer off switch
# source: https://docs.mainsail.xyz/overview/quicktips/printer-power-switch
#####################################################################
[power printer]
# This avoides the error when a printer is powered off. Instead a button to power it on is shown in mainsail
# Prerequisits: 1) Mainsail running, even if the printer is powered off. 2) Printer is connected to a switchable socket.

# Important is the name "printer" and the attribute "bound_services: klipper".
# Mainsail will use this power device to check for a "powered off" printer.

# There are different ways to power o/off the printer:
# For a GPIO-based relay (e.g., connected to a Raspberry Pi pin):
  type: gpio
  pin: gpiochip0/gpio4  # Adjust to your GPIO pin
  on_value: 1  # Value to turn on (high/low depends on relay)
# For a USB relay (e.g., via HID):
  type: hid
  device: /dev/hidraw0  # Check with `ls /dev/hidraw*`
  on_command: "relay 1 on"  # Relay-specific command
# For a network-based smart plug (e.g., TP-Link via Kasa plugin):
  type: kasa
  host: 192.168.1.100  # IP of the smart plug

# Bind the device to Klipper services to enable automatic detection:
bound_services: klipper  # This links it to Klipper; use commas for multiple (e.g., klipper,nginx)


