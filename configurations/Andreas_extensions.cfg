### MCU Update
# # $ ~/klippy-env/bin/python ~/katapult/scripts/canbus_query.py can0     # UUID ermitteln
################################################################################################
################################################################################################
[gcode_shell_command shell_mcu_update]
command: /home/andreas/printer_data/scripts/mcu_update.sh {params}      # executes the shell command mcu_update.sh
                                                                    # ??? ttyACM0 muß geprüft werdne ???
timeout:120                                                         # Maximum tine Klipper will wait for the script to complete before aborting. (in seconds)
verbose: True

########################################
[gcode_macro mcu_board_update]
description: Flash the MCU (STM32) on the Skipr board via USB bus
 #$ make -j4 flash FLASH_DEVICE=/dev/ttyACM0
gcode:
  {% set cfg  = "~/printer_data/make_config_files/stm32f407_firmware.config" %}           # config file for make menuconfig
  {% set flash_device = "/dev/ttyACM0" %}                                                 # FLASH_DEVICE = PORT für STM43f407 auf MKS Skipr board
  {% set uuid = printer.configfile.settings["mcu"]["canbus_uuid"] %}                      # UUID
  {% set args = "-m usb -c " ~ cfg ~ " -d " ~ flash_device ~ " -u " ~ uuid %}             # Combine it to a string
  RUN_SHELL_COMMAND CMD=shell_mcu_update PARAMS={% raw %}{{ args }}{% endraw %}              # Calls the gcode_shell_command sh_mcu_update
  
  #RUN_SHELL_COMMAND CMD=shell_mcu_update PARAMS="-m usb -c {{ cfg }} -d {{ flash_device }} -u {{ uuid }}"    # Calls the gcode_shell_command sh_mcu_update

########################################
[gcode_macro mcu_toolhead_update]
description: Flash the Controller (RP2040) on the toolhead board via CAN bus
gcode:
  {% set cfg  = "~/printer_data/make_config_files/eecan_firmware.config" %}         # config file for make menuconfig
  {% set flash_device = "2e8a:0003???" %}                                           #
  {% set uuid = printer.configfile.settings["mcu EECAN"]["canbus_uuid"] %}          # UUID
  {% set args = "-m usb -c " ~ cfg ~ " -u " ~ uuid %}                               # Combine it to a string
  RUN_SHELL_COMMAND CMD=shell_mcu_update PARAMS={% raw %}{{ args }}{% endraw %}        # Calls the gcode_shell_command sh_mcu_update

########################################
[gcode_macro mcu_linux_update]
description: update the Linux MCU
gcode:

########################################
[gcode_macro mcu_all_pdate]
description: Flash the Skipr board MCU and the toolhead board controller
gcode:
  mcu_board_update
  mcu_toolhead_update
  mcu_linux_update



