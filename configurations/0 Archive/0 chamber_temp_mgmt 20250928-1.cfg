################################################################################################
# G-Code to set chamber temeprature in slicer.
################################################################################################
# OrcaSlicer use M141/M191 command to control active chamber heater.
# If your Filament's Activate temperature control and your printer Support control chamber temperature option are checked , OrcaSlicer will insert M191 command at the beginning of the gcode (before Machine G-code).

# To set the chamber temperature to the value specified for the first filament: M191 S{chamber_temperature[0]}
# To set the chamber temperature to the highest value specified across all filaments: M191 S{overall_chamber_temperature}
# Source: https://github.com/SoftFever/OrcaSlicer/wiki/chamber-temperature

#####################################################################
[gcode_macro M141]
description: Sets the target temperature for the chamber_heater and chamber_exhaust_fan. Without waiting for the target temperature to be reached.
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s == 0 %}                                                         # If target temperature is 0, do nothing
        M117 Chamber target temp 0°C --> Doing nothing. No chamber-heating, leaving chamber_exhaust_fan at default values.
        # If target temperature is 0, do nothing
    {% elif s > 0 %}
        M117 Start chamber heating.
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s}             # set target temeperature to chamber_heater.
        SET_TEMPERATURE_FAN_TARGET FAN=chamber_exhaust_fan TARGET={s}       # set target temperature to chamber_exhaust_fan (when to spin up)
        # M140 S100                                                         # Print bed heater will support heating the chamber. Uncomment to activate.
        M117 NOT waiting until chamber temeprature reached. Start printing.
    {% else %}
        M117 Temperature not >=0°C --> Doing nothing. No chamber-heating, leaving chamber_exhaust_fan at default values.
        # If target temperature is not above 0°C, do nothing
    {% endif %}

#####################################################################
[gcode_macro M191]
description: Sets the target temperature for the chamber_heater and chamber_exhaust_fan and pauses G-code execution until the target temperature is reached.
gcode:
    {% set s = params.S|default(0)|float %}                                 # Save the target chamber tememperature in variable s
    {% if s == 0 %}                                                         # If target temperature is 0, do nothing
        M117 Chamber target temp 0°C --> Doing nothing. No chamber-heating, leaving chamber_exhaust_fan at default values.
        # If target temperature is 0, do nothing
    {% elif s > 0 %}
        M117 Set chamber target temperature to chamber_heater and chamber_exhaust_fan.
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s}             # set target temeperature to chamber_heater.
        SET_TEMPERATURE_FAN_TARGET FAN=chamber_exhaust_fan TARGET={s}     # set temperature to chamber_exhaust_fan, when to spin up.
        # M140 S100                                                         # Print bed heater will support heating the chamber. Uncomment to activate.
        M117 Waiting until chamber temeprature reached ... 
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={s-1} MAXIMUM={s+1}     # Waits until chamber temeprature is reached. Tolerance: +-1°C
        M117 Chamber target temperature reached. Start printing.
    {% else %}
        M117 Temperature not >=0°C --> Doing nothing. No chamber-heating, leaving chamber_exhaust_fan at default values.
        # If target temperature is not above 0°C, do nothing
    {% endif %}
