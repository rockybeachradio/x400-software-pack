####################################################################
# Temperature - Make temperatures available for script. and shown in Mainsail Dashboard.
#####################################################################
[temperature_sensor SKIPR_SoC_temperature]    # SoC temperature (Linux CPU)
#sensor_path:                                 # The path to temperature system file. The default is "/sys/class/thermal/thermal_zone0/temp" which is the temperature system file on a Raspberry Pi computer.
sensor_type: temperature_host                 # Linkes to the SoC (default)
min_temp: 10                                  # minimal value. If sensodr reads below that value, it assumes failure (in °C)
max_temp: 85                                  # max acceptable temperature. If temperature exceeds, Klipper thwows an error (in °C)

[temperature_sensor SKIPR_MCU_temperature]    # Controller (STM32 chip)
#sensor_mcu: mcu                               # The micro-controller to read from. The default is "mcu".
sensor_type: temperature_mcu                  # Linkes to the MCU (default)
min_temp: 0                                   # minimal value. If sensodr reads below that value, it assumes failure (in °C)
max_temp: 85                                  # max acceptable temperature. If temperature exceeds, Klipper thwows an error (in °C)

[temperature_sensor Toolehad_RP2040_temperature]  # Temperatur of the RP2040 Chips in the toolhead baord
sensor_mcu: EECAN
sensor_type: temperature_mcu
min_temp: 0
max_temp: 85


