#######################################
[controller_fan electronics_bay_fan]
# The fan will stop whenever an idle_timeout is reached to ensure no overheating will occur after deactivating a watched component.
pin: PA2  # Port name on SKIPR board: FAN0
max_power: 1.0
shutdown_speed: 1.0               # When klipper shuts down, it sets the speed of the fan to that value, instead tunring it off. Default: 0
cycle_time: 0.001                 # PWN freuency. 0.0001 second = 1klHz (1/0.001)
hardware_pwm: false               # True = Hardware-based PWM (my improve performance when board support it). False = Software besed PWM
kick_start_time: 0.5
off_below: 0.2
fan_speed: 1.0                    # The fan will be set to when a heater or stepper driver is active. Value from 0.0 to 1.0). Default is 1.0
idle_timeout: 120                 # The amount of time (in seconds) after a stepper driver or heater was active and the fan should be kept running. Default: 30
# Name of the config section defining the heater/stepper that this fan is associated with. If a comma separated list of heater/stepper names is provided here, then the fan will be enabled when any of the given heaters/steppers are enabled.
heater: extruder, heater_bed, chamber_heater                                      # Default: "extruder" heater
#stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3    #  Default: all stepper motors.


