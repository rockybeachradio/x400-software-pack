##################################################################################################################
################################################################################################
# To make thresholeds visible and editable in mainsail dahsboard. These are the macros used in the widget.
[gcode_macro SET_MCU_TEMP_THRESHOLD]
description: Set the MCU temperature threshold for the electronics bay fan
gcode:
  {% set value = params.VALUE|default(40.0)|float %}
  {% if value >= 0 and value <= 100 %}
    SAVE_VARIABLE VARIABLE=andreas_mcu_temp_thr_for_electronics_bay_fan VALUE={value}
    M117 MCU Temp Threshold set to {value}C
  {% else %}
    M117 Error: VALUE must be between 0 and 100
  {% endif %}

[gcode_macro SET_SOC_TEMP_THRESHOLD]
description: Set the SoC temperature threshold for the electronics bay fan
gcode:
  {% set value = params.VALUE|default(50.0)|float %}
  {% if value >= 0 and value <= 100 %}
    SAVE_VARIABLE VARIABLE=andreas_soc_temp_thr_for_electronics_bay_fan VALUE={value}
    M117 SoC Temp Threshold set to {value}C
  {% else %}
    M117 Error: VALUE must be between 0 and 100
  {% endif %}

[gcode_macro SET_ELECTRONICS_BAY_FAN_SPEED]
description: Set the electronics bay fan speed (0.0 to 1.0)
gcode:
  {% set value = params.VALUE|default(1.0)|float %}
  {% if value >= 0.0 and value <= 1.0 %}
    SAVE_VARIABLE VARIABLE=andreas_electronics_bay_fan_speed VALUE={value}
    M117 Fan Speed set to {value*100}%
  {% else %}
    M117 Error: VALUE must be between 0.0 and 1.0
  {% endif %}