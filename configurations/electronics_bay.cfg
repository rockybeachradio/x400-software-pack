#####################################################################
# Electronics bay temeprature check
#####################################################################
[gcode_macro electronics_bay_temperature_check]
description: Cheks the temperature of Soc and MCU and activates the electronics bay cooling fan if MCU or SoC is above threshold temperature
#Checks MCU and SoC temperatures and warns or aborts
gcode:
  {% set vars = printer.save_variables.variables %}
  {% set mcu_temp_threshold = (vars.andreas_mcu_temp_thr_for_electronics_bay_fan|default(40.0))|float %}    # Reads the defined threshold from the variable.cfg
  {% set soc_temp_threshold = (vars.andreas_soc_temp_thr_for_electronics_bay_fan|default(50.0))|float %}
  {% set eb_bay_fan_speed = (vars.andreas_electronics_bay_fan_speed|default(1))|float %}           # Fan Speed: 1 = 100%

  {% set mcu_temp = printer["temperature_sensor SKIPR_MCU_temperature"].temperature|float %}        # read tempearature
  {% set soc_temp = printer["temperature_sensor SKIPR_SoC_temperature"].temperature|float %}

# emergency shutdown
  {% if mcu_temp > 85 or soc_temp > 85 %}
    { action_respond_error("🔥 MCU or SoC temperature is TOO HIGH! Emergency Shutdown!") }
    M112 ; emergency stop
  {% elif mcu_temp > 75 or soc_temp > 75 %}
  {% else %}
    { action_respond_info("✅ Temperatures OK: MCU = %.1f°C, SoC = %.1f°C" % (mcu_temp, soc_temp)) }
  {% endif %}

# controll electronics bay fan
  {% if mcu_temp > mcu_temp_threshold or soc_temp > soc_temp_threshold %}
    SET_FAN_SPEED FAN=electronics_bay_fan SPEED={eb_bay_fan_speed}
    { action_respond_info("Cooling fan ON (MCU=%.1f°C, SoC=%.1f°C)" % (mcu_temp, soc_temp)) }
  {% else %}
    {% if printer.print_stats.state == "printing" %}
      { action_respond_info("Teperature below threshold. Printer is printing. Leave colling fan as is.") }
    {% else %}
      SET_FAN_SPEED FAN=electronics_bay_fan SPEED=0.0
      { action_respond_info("Teperature below threshold. Not printing. Turning cooling fan OFF") }
    {% endif %} 
  {% endif %} 


