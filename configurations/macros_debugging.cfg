################################################################################################
# Check printer status and show status
################################################################################################
[gcode_macro DISPLAY_PRINTER_STATUS]
description: Show printer status (Mainsail-style) on display
gcode:
    {% set ps = printer.print_stats.state|lower %}
    {% set it = (printer.idle_timeout.state if 'idle_timeout' in printer else 'ready')|lower %}
    {% set badge = 'Standby' %}

    {% if ps == 'printing' %}
        {% set badge = 'Printing' %}
    {% elif ps == 'paused' %}
        {% set badge = 'Paused' %}
    {% elif ps == 'resuming' %}
        {% set badge = 'Resuming' %}
    {% elif ps == 'error' %}
        {% set badge = 'Error' %}
    {% elif ps == 'cancelled' %}
        {% set badge = 'Cancelled' %}
    {% elif ps == 'complete' %}
        {% set badge = 'Finished' %}
    {% elif ps == 'standby' %}
        {% set badge = 'Standby' %}
    {% else %}
        {% if it == 'ready' %}
            {% set badge = 'Standby' %}
        {% elif it == 'printing' %}
            {% set badge = 'Busy' %}
        {% elif it == 'shutdown' %}
            {% set badge = 'Error' %}
        {% else %}
            {% set badge = it|capitalize %}
        {% endif %}
    {% endif %}

      M117 {badge}


################################################################################################
# Which axis is homed and which endstop is triggered?
################################################################################################
[gcode_macro which_axis_is_homed_triggered]
gcode:
    {action_respond_info("printer.toolhead.homed_axes = " ~ printer.toolhead.homed_axes)}
    {% if 'x' not in printer.toolhead.homed_axes|lower %}
        { action_respond_info("x axis not in printer.toolhead.homed_axes") }
    {% else %}
        { action_respond_info("x axis is in printer.toolhead.homed_axes") }
    {% endif %}
    {% if 'y' not in printer.toolhead.homed_axes %}
        { action_respond_info("y axis not in printer.toolhead.homed_axes") }
    {% else %}
        { action_respond_info("y axis is in printer.toolhead.homed_axes") }
    {% endif %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        { action_respond_info("z axis not in printer.toolhead.homed_axes") }
    {% else %}
        { action_respond_info("z axis is in printer.toolhead.homed_axes") }
    {% endif %}
    {% if 'e' not in printer.toolhead.homed_axes %}
        { action_respond_info("e axis not in printer.toolhead.homed_axes") }
    {% else %}
        { action_respond_info("e axis is in printer.toolhead.homed_axes") }
    {% endif %}
    { action_respond_info("-") }
    
    QUERY_PROBE         # Refresh probe state
    QUERY_ENDSTOPS      # Refresh endstop states
    { action_respond_info("-") }


####################################################################
# Dump Variables
####################################################################
# Arguments
#   NAME (string) - Filter results based on name (only show varables with names containing this string)
#   VALUE (string) - Filter results based on value (only show values containing this value)
#   SHOW_CFG (integer, 0-1) - Set to 1 to include entire config in output. Default 0 (config filtered out)
# Examples
#   DUMP_VARIABLES: Returns all variables (excluding printer['configfile'].config and printer['configfile'].settings as they contain the entire config).
#   DUMP_VARIABLES NAME=stepper: Returns all variables which have the string stepper in their name.
#   DUMP_VARIABLES VALUE=extruder : Returns all variables which have the string extruder in their value.
#   DUMP_VARIABLES NAME=stepper VALUE=extruder : Returns all variables which have the string stepper in their name and the string extruder in their value.
#   DUMP_VARIABLES SHOW_CFG=1 : Returns all variables, including the config.
[gcode_macro DUMP_VARIABLES]
description: Dumps all current Klipper variables to the g-code terminal.
#   This helps to find Klipper system variables for use in macros. A filter for both name and value can be applied.
#   source: https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/dump_variables.html
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}


####################################################################
# Get variable infos
####################################################################
# Arguments
#   NAME (string) (required) - Specify the name of the variable that you want to retreive.
# Examples
#   GET_VARIABLE NAME=toolhead: Returns value and type of variable printer.toolhead.
#   GET_VARIABLE NAME=bed_mesh.profiles.default.points.1.0: Returns value and type of variable printer.bed_mesh.profiles.default.points[1][0].
[gcode_macro GET_VARIABLE]
description: Returns value and type of a single variable to the g-code terminal. Keys and indexes can be chained to access nested dictionaries and lists.
#   source: https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/get_variable.html
gcode:
    {% set names = (params.NAME).split('.')|list %}
    {% set join = (params.JOIN)|default(1)|int %}
    
    {% set _dummy0 = namespace( break = 0 ) %}
    {% set _dummy1 = namespace( out = printer[names|first] ) %}
    
    {% for name in names if _dummy0.break == 0 %}
        {% if loop.index > 1 %}
            {% if name in _dummy1.out %}
                {% set _dummy1.out = _dummy1.out[name] %}
            {% elif name[0] in '0123456789' and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping and _dummy1.out|length > name[0]|int %}
                {% set _dummy1.out = _dummy1.out[name|int] %}
            {% else %}
                {% set _dummy0.break = loop.index0 %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    {% if _dummy1.out is boolean %}
        { action_respond_info('Type: boolean') }
    {% elif _dummy1.out is float %}
        { action_respond_info('Type: float') }
    {% elif _dummy1.out is integer %}
        { action_respond_info('Type: integer') }
    {% elif _dummy1.out is mapping %}
        { action_respond_info('Type: mapping') }
    {% elif _dummy1.out is string %}
        { action_respond_info('Type: string') }
    {% elif _dummy1.out is iterable %}
        { action_respond_info('Type: iterable') }
    {% elif _dummy1.out is none %}
        { action_respond_info('Type: none') }
    {% elif _dummy1.out is undefined %}
        { action_respond_info('Type: undefined') }
    {% elif _dummy1.out is callable %}
        { action_respond_info('Type: callable') }
    {% else %}
        { action_respond_info('Type: unknown') }
    {% endif %}
    
    {% if join and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping %}
        { action_respond_info('%s' % _dummy1.out|join("\n")) }
    {% else %}
        { action_respond_info('%s' % _dummy1.out) }
    {% endif %}
    
    {% if _dummy0.break != 0 %}
        { action_respond_info('"printer.%s" does not contain "%s"!' % (names[0:_dummy0.break]|join('.'), names[_dummy0.break])) }
    {% endif %}



####################################################################
# Search vor vairables
####################################################################
[gcode_macro SEARCH_VARS]
description: Search for variables in the "printer" object from Klipper
# source: https://github.com/Frix-x/klippain/blob/main/macros/miscs/debugging.cfg
gcode:
    {% set search = params.S|lower %}
    {% set ns = namespace() %}
    {% for item in printer  %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item), ''] %}
        {% else %}
            {% set ns.path = ['printer.', item, ''] %}
        {% endif %}

        {% if search in ns.path|lower %}
            { action_respond_info(ns.path|join) }
        {% endif %}

        {% if printer[item].items() %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int + 1] %}

                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %}

                {% if child is mapping  %}
                    { loop(child.items()) }
                {% else %}
                    {% if search in ns.path|lower %}
                        { action_respond_info("%s : %s" % (ns.path|join, child)) }
                    {% endif %}
                {% endif %}

            {% endfor %}
        {% endif %}
    {% endfor %}
    