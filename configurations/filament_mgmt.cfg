  ################################################################################################
# File: filament_mgmt.cfg
# Author: Eryone / Modified by Andreas
# Date: 20250812 / 20251018
# purpose: Filament Handling
#  - sensor triggered behaviour
#  - Macros
# 
# include in printer.cfg
################################################################################################
# Filament sensor configuration & actions on trigger
# - toolhead_filament_sensor    - What happens when a runout is detected & after fixing it
# - filament_tangle_sensor      - What happesn when a tangle is detected & after fixing it
# - SET_FILAMENT_SENSOR         - Sets the filament sensor on/off and save value to file
# - _RESTORE_FILAMENT_SENSOR    - Restore the filament sensor on/off state at klipper start
# - LOAD_FILAMENT
# - UNLOAD_FILAMENT
################################################################################################


################################################################################################
# Filament sensor on toolhead
################################################################################################
[filament_switch_sensor toolhead_filament_sensor]
switch_pin:!EECAN:gpio18    # Runout Sensor in toolhead - #XYE mcu E0DET
pause_on_runout: True       # When set to True, a PAUSE will execute immediately after a runout is detected. Default is True.
                            # If pause_on_runout is False and the runout_gcode is omitted then runout detection is disabled.
#event_delay: 3.0           # The minimum amount of time to delay between events, in seconds. Events triggered during this time period will be silently ignored. Default is 3 seconds.
#pause_delay: 0.5           # The amount of time to delay between the pause command ispatch and execution of the runout_gcode, in seconds. Default is 0.5 seconds.
                            # It may be useful to increase this delay if OctoPrint exhibits strange pause behavior.

runout_gcode:       # what should be done when a Fileament rounout is detected
# --> PAUSE macro runs, when filaemntsensor is triggered, beause pause_on_runout is ture
  {% set toolhead_purging_position_x = (printer.save_variables.variables.andreas_toolhead_purging_position_x|default(0))|float %}    # Reads the value from variable.cfg
  {% set toolhead_purging_position_y = (printer.save_variables.variables.andreas_toolhead_purging_position_y|default(0))|float %}    # Reads the value from variable.cfg
  {% set toolhead_purging_position_z = (printer.save_variables.variables.andreas_toolhead_purging_position_z|default(0))|float %}    # Reads the value from variable.cfg
  
  {% if printer.idle_timeout.state == "Printing" %}
    M117 RUNOUT runout_gcode: Filament runout detected.
    {action_respond_info("RUNOUT runout_gcode: Filament runout detected")}
    SAVE_GCODE_STATE NAME=runout_detected
    PAUSE             # Calls the Klipper PAUSE macro. Pauses the current print. The current position is captured for restoration upon resume.
                      # --> PAUSE macro runs, when filaemntsensor is triggered. Because pause_on_runout is True --> ??? Why trigger again?

    G4 P2000          # Pause for 2000ms (=2seconds)
    G91             # Relative mode
    G1 E-5 F300     # Retract a liddle. Prevent oozing.
    G1 Z10 F600     # Lift nozzle by 10 mm

    _status_bar PS="error"
    
    # Move toolhead to purging position: XY only
    G90
    G1 X{toolhead_purging_position_x} Y{toolhead_purging_position_y}
    
    M117 RUNOUT runout_gcode: Please insert filament. Print will then continue.
    {action_respond_info("RUNOUT runout_gcode: Please insert filament. Print will then continue.")}
  {% else %}
    # If printer is not printing or a mid print filament change is performes: DO nothing.
    M117 RUNOUT runout_gcode: Filament runout detected. Not printing. Ignoring it.
    {action_respond_info("RUNOUT runout_gcode: Filament runout detected. Not printing. Ignoring it.")}
  {% endif %}

insert_gcode:       # what should be done when a Fileament is reinserted after a filament runout
  event_delay: 1.0    # The minimum amount of time to delay between events, in seconds. Events triggered during this time period will be silently ignored. The default is 3 seconds.
  {% if printer.idle_timeout.state == "Paused" or printer.pause_resume.is_paused == True %} # Only when filament runout was detected during print.
    _status_bar PS="progress"
    M117 RUNOUT insert_gcode: Filament insertion detected. Starting LOAD_FILAMENT macro.
    {action_respond_info("RUNOUT insert_gcode: Filament insertion detected. Starting LOAD_FILAMENT macro.")}
   
# ??? !!! EINBAUEN: FILAMENTCHANGE ord RUNOUTDETECTION --> To save filament.
    # {% if FILAMENTCHANGE ....
    # LOAD_FILAMENT SPEED=1 MODE=FILAMENTCHANGE      # Call the macro LOAD_FILAMENT.
    # {% else %}
      LOAD_FILAMENT SPEED=1 MODE=RUNOUTDETECTION      # Call the macro LOAD_FILAMENT.
    # {% endif %}

    #CLEAR_PAUSE  # Clears pause without reuming
    RESTORE_GCODE_STATE NAME=runout_detected MOVE=1
    RESUME
  {% else %}
    M117 RUNOUT insert_gcode: Filament insertion detected. Not paused. Ignoring it.
    {action_respond_info("RUNOUT insert_gcode: Filament insertion detected. Not paused. Ignoring it.")}
  {% endif %}


################################################################################################
# Tangle Sensor
################################################################################################
[filament_switch_sensor filament_tangle_sensor]
switch_pin:PB15                       # Tangle Sensor - #XYE mcu E0DET
pause_on_runout: True                 # When set to True, a PAUSE will execute immediately after a runout is detected. Default is True.
                                      # Note that if pause_on_runout is False and the runout_gcode is omitted then runout detection is disabled.
#event_delay: 3.0                     # The minimum amount of time in seconds to delay between events. Events triggered during this time period will be silently ignored. The default is 3 seconds.
#pause_delay: 0.5                     # The amount of time to delay, in seconds, between the pause command dispatch and execution of the runout_gcode. Default is 0.5 seconds.
                                      # It may be useful to increase this delay if OctoPrint exhibits strange pause behavior.

runout_gcode:                         # what should be done when a Fileament rounout is detected
  M117 TANLGE runout_gcode: Filament tangled
  {action_respond_info("TANLGE runout: Filament tangled")}
  _status_bar PS="error"

  PAUSE                               # Calls the Klipper PAUSE macro 
                                      # --> PAUSE macro runs, when filaemntsensor is triggered. Because pause_on_runout is True --> ??? Why trigger again?

  G4 P2000                            # Pause for 2000ms (=2seconds)
  #SET_IDLE_TIMEOUT TIMEOUT=864000    # Delay of one day in seconds

  ;G1 Y50 X399  F3600 
  ;UNLOAD_FILAMENT
  ;FILAMENT CHANGE
  ;PRINT CONTINUE

insert_gcode:                         # what should be done when a Fileament is reinserted after a filament runout
  M117 TANLGE insert_gcode: Filament inserted
  {action_respond_info("TANGLE insert: Filament inserted")}
  _status_bar PS="progress"
  ;LOAD_FILAMENT


################################################################################################
# SET_FILAMENT_SENSOR 
################################################################################################
[gcode_macro SET_FILAMENT_SENSOR]
description: Set the filament sensor on/off and save value to file
rename_existing: SET_FILAMENT_SENSOR_BASE
gcode:
  {% if printer.save_variables.variables.filament_sensor is not defined %}
    {% set filament_sensor = {params.SENSOR|string: params.ENABLE|int} %}
  {% else %}
    {% set filament_sensor = printer.save_variables.variables.filament_sensor %}
    {% set _dummy = filament_sensor.update({params.SENSOR|string: params.ENABLE|int}) %}
  {% endif %}

  SET_FILAMENT_SENSOR_BASE SENSOR={params.SENSOR} ENABLE={params.ENABLE}
  
  SAVE_VARIABLE VARIABLE=filament_sensor VALUE="{filament_sensor}"


################################################################################################
# _RESTORE_FILAMENT_SENSOR
################################################################################################
[gcode_macro _RESTORE_FILAMENT_SENSOR]
description: Restore the filament sensor on/off state at klipper start
gcode:
  {% if printer.save_variables.variables.filament_sensor is defined %}
    {% for sensor in printer.save_variables.variables.filament_sensor %}
      SET_FILAMENT_SENSOR_BASE SENSOR={sensor} ENABLE={printer.save_variables.variables.filament_sensor[sensor]}
    {% endfor %}
  {% endif %}


################################################################################################
# LOAD_FILAMENT
################################################################################################
[gcode_macro LOAD_FILAMENT]
description: Load Filament
  # KlipperScreen Macro is different: https://klipperscreen.readthedocs.io/en/latest/macros/
  # ??? !!! Alternatvie to check and incorporate: https://github.com/Frix-x/klippain/blob/main/macros/helpers/filament_swap.cfg
gcode:
  ################################
  # ::: Define variables :::
  {% set toolhead_purging_position_x = (printer.save_variables.variables.andreas_toolhead_purging_position_x|default(0))|float %}    # Reads the value from variable.cfg
  {% set toolhead_purging_position_y = (printer.save_variables.variables.andreas_toolhead_purging_position_y|default(0))|float %}    # Reads the value from variable.cfg
  {% set toolhead_purging_position_z = (printer.save_variables.variables.andreas_toolhead_purging_position_z|default(0))|float %}    # Reads the value from variable.cfg

  {% set NOZZLE_TEMP = params.NOZZLE_TEMP|default(220)|float %}
  {% set SPEED       = params.SPEED|default(0)|int %}             # Is only called in toolhead_filament_sensor. # ??? May be the same purpose than MODE?
  {% set MODE        = params.MODE|default("AUTO")|string %}  # START, RUNOUTDETECTION, AUTO. [runout]-insert_gcode: ruf dies mit RUNOUTDETECTION auf.
    # Decide whether homing is allowed:
    # - MODE=AUTO: allow homing only if not printing yet. Default: AUTO (if no parameter was handed over)
    # - MODE=START: allow homing (start-of-print prep)
    # - MODE=RUNOUTDETECTION: never home (mid-print runout recovery)
    # - MODE=FILAMENTCHANGE: never home (mid-print filament change: colour, material)    
  {% set allow_home = (
        (MODE == "START") or
        (MODE == "AUTO" and printer.print_stats.state not in ["printing", "paused"])
    ) %}

  {% set poop_height_z = 14|float %}
  {% set ooze_offset_z = 40|float %}
  {% set ooze_spd_z = 120|float %}

  { action_respond_info("Target nozzle temperature %s "%NOZZLE_TEMP) }
  { action_respond_info("Load Filament printing %d" %SPEED) }

  ################################
  # ::: Check :::
  {% if printer['filament_switch_sensor toolhead_filament_sensor'].filament_detected %}   # Check if filemant sensor is detecting a filament.
    M117 Filament detected. Starting the loading process.
    { action_respond_info("Filament detected. Starting the loading process.") }
    _status_bar PS="progress"

    ################################
    # ::: Prepare loading :::
    #SAVE_GCODE_STATE NAME=load_filament   # Save current settings. Will be restored at the end of the script.

    ################################
    # ::: RUNOUTDETECTION yes :::
    {% if MODE == "RUNOUTDETECTION"  or MODE =="FILAMENTCHANGE" %}
      {% if ('x' not in printer.toolhead.homed_axes|lower or 'y' not in printer.toolhead.homed_axes|lower or 'z' not in printer.toolhead.homed_axes|lower) and allow_home == Flase %}  
        M117 LOAD_FILAMENT: X,Y or Z axis not homed and varaible allow_home is False. Printer PAUSE
        { action_respond_info("LOAD_FILAMENT: X,Y or Z axis not homed and varaible allow_home is False. Printer PAUSE") }
        PAUSE
        _status_bar PS="error"
      {% else %}  # homing needed & allowed
        {% if printer.pause_resume.is_paused == False and SPEED == 0 %}     # Only self-pause if printer is not already paused AND caller didn't pass SPEED>0
          { action_respond_info("pausing") }
          PAUSE                     # Calls the Klipper PAUSE macro
          G4 P1000
          ;SET_IDLE_TIMEOUT TIMEOUT=864000 ; one day in seconds
        {% endif %} 

        SAVE_GCODE_STATE NAME=load_filament   # Save current settings. Will be restored at the end of the script.

        M117 LOAD_FILAMENT: Move toolhead 
        G91
        G1 Z5    # Lifting nozzle by 5mm. To cleare from bed

        M104 S{NOZZLE_TEMP}   # Start heating nozzle to save time later.

        M117 LOAD_FILAMENT: Move toolhead to purge position
        G90
        G1 X{toolhead_purging_position_x} Y{toolhead_purging_position_y}

        M117 LOAD_FILAMENT: Waiting for nozzle reaching target temperature
        M109 S{NOZZLE_TEMP}
        M106 S50  # Turn on the part cooling fan

        M117 LOAD_FILAMENT: Prepare filament action  # runout detected: No colour change --> small purge   
        G91
        M83             # Put the extruder into relative mode
        G92 E0.0
        M117 LOAD_FILAMENT: Loading filament  
        G1 E20 F300     # Load filament
        M400
        M117 LOAD_FILAMENT: Compacting filament in nozzle
        {% if MODE == "RUNOUTDETECTION"%}
          G1 E10 F300     # Purge - extract short.
        {% elif MODE =="FILAMENTCHANGE" %}
          G1 E60 F300     # Purge - extract long.
        {% endif %} 

        G92 E0.0        # Reset the extruder again
        M82             # Put the extruder back into absolute mode.
        G90

        M400            # Needed. Prevents the execution of M400 before purging "G1 E80" is completed.
        M106 S125       # Use part cooling to harden the material. Not 255=100% because filament drys too fast.
        M104 S0         # Turn off nozzle heater
        G4 P5000        # Timer to allow part cooling fan to blow filament away
        M106 S50        # Set part cooling fan to low rotation.

        #M117 LOAD_FILAMENT: Move toolhead back to position where it was before LOAD_FILAMENT
        #RESTORE_GCODE_STATE NAME=load_filament MOVE=1       # Move toolhead back to position before LOAD_FILAMENT process started --> done in [filament_switch_sensor toolhead_filament_sensor]: insertion_gcode
        M117 LOAD_FILAMENT: Filament loaded
      {% endif %} # homing needed & allowed

    ################################
    # ::: no RUNOUTDETECTION :::
    {% else %}  # Mode not RUNOUTDETECTION
      {% if 'xy' not in printer.toolhead.homed_axes|lower %}                  # When in mid Print, axis should be homed. During Print start, nothing is homed at the point of PAUSE.
        M117 LOAD_FILAMENT: Homing needed. Calling G28 X Y
        { action_respond_info("LOAD_FILAMENT: Homing needed. Calling: G28 X Y") }
        G28                                                              # If X or Y not homed, all axis X,Y,Z will be homed. Even if G28 X Y is called.
        { action_respond_info("z%f " %  printer.toolhead.position.z) }
        #{% if 'z' not in printer.toolhead.homed_axes|lower %}             # As soon as G28 X Y is axecuted, z is assuemd as homed due to "set_position_z:0" in [homing_override]
        # SET_KINEMATIC_POSITION Z={ printer.toolhead.position.z }        # If this is done (without Z homing, like in eryones code) the toolhead might end up on the bed or up in the air.
        #{% endif %}
      {% endif %}

      SAVE_GCODE_STATE NAME=load_filament   # Save current settings. Will be restored at the end of the script.

      M117 LOAD_FILAMENT: Move toolhead 
      G91
      G1 Z5    # Lifting nozzle by 5mm. To cleare from bed

      M104 S{NOZZLE_TEMP}   # Start heating nozzle to save time later.

      G90
      G1 X{toolhead_purging_position_x} Y{toolhead_purging_position_y} Z{poop_height_z} F3600    # move toolhead to pruging position, including Z height

      M117 LOAD_FILAMENT: Waiting for nozzle reaching target temperature
      M109 S{NOZZLE_TEMP}

      M106 S50  # Turn on the part cooling fan

      # Loading filament
      M117 LOAD_FILAMENT: Prepare filament action  # MODE not RUNOUTDETECTION --> big purge
      G91
      M83             # Put the extruder into relative mode
      G92 E0.0
      M117 LOAD_FILAMENT: Loading filament       
      G1 E20 F300     # Load filament
      M400
      M117 LOAD_FILAMENT: Transition filament
      G1 E80 F300     # Purge - extract long for colour change
      G92 E0.0        # Reset the extruder again
      M82             # Put the extruder back into absolute mode.
      G90

      # Preventing filament sticking to the nozzle.
      M400          # Needed. Prevents the execution of M400 before purging "G1 E80" is completed.
      M106 S127     # Use part cooling to harden the material. Not 255=100% because filament drys too fast.
      M104 S0       # Turn off nozzle heater  
      M82           # Put the extruder back into absolute mode. # After M400 to ensure that it is really done.
      G90
      G1 Z{poop_height_z + ooze_offset_z} F{ooze_spd_z}   # Slowly moving up to ensure ooze is straight and can be broken off
      G1 Z{poop_height_z + ooze_offset_z - 10}
      M107          # Stop part cooling fan

      RESTORE_GCODE_STATE NAME=load_filament MOVE=1
      _status_bar PS="idle"
      M117 LOAD_FILAMENT: Filament loaded

    {% endif %}   # RUNOUTDETECTION
  {% else %}      # Check if filemant sensor is detecting a filament.
    M117 No filament detected. Insert filament and call macro again.
    { action_respond_info("No filament detected. Insert filament and call macro again.") }
  {% endif %}


################################################################################################
# UNLOAD_FILAMENT
################################################################################################
[gcode_macro UNLOAD_FILAMENT]
description: Unload Filament
  # KlipperScreen Macro is different: https://klipperscreen.readthedocs.io/en/latest/macros/
  # ??? !!! Alternatvie to check and incorporate: https://github.com/Frix-x/klippain/blob/main/macros/helpers/filament_swap.cfg
gcode:

  ################################
  # ::: Define variables :::
  {% set toolhead_purging_position_x = (printer.save_variables.variables.andreas_toolhead_purging_position_x|default(0))|float %}    # Reads the value from variable.cfg
  {% set toolhead_purging_position_y = (printer.save_variables.variables.andreas_toolhead_purging_position_y|default(0))|float %}    # Reads the value from variable.cfg
  {% set toolhead_purging_position_z = (printer.save_variables.variables.andreas_toolhead_purging_position_z|default(0))|float %}    # Reads the value from variable.cfg

  {% set NOZZLE_TEMP = params.NOZZLE_TEMP|default(220)|float %}
  {% set SPEED       = params.SPEED|default(0)|int %}             # Is only called in toolhead_filament_sensor. # ??? May be the same purpose than MODE?
  {% set MODE        = params.MODE|default("AUTO")|string %}  # START, RUNOUTDETECTION, AUTO. [runout]-insert_gcode: ruf dies mit RUNOUTDETECTION auf.
    # Decide whether homing is allowed:
    # - MODE=AUTO: allow homing only if not printing yet. Default: AUTO (if no parameter was handed over)
    # - MODE=FILAMENTCHANGE: never home (mid-print filament change: colour, material)    
  {% set allow_home = (MODE == "AUTO" and printer.print_stats.state not in ["printing", "paused"]) %}

  {% set poop_height_z = 14|float %}
  {% set ooze_offset_z = 40|float %}
  {% set ooze_spd_z = 120|float %}

################################
  # ::: Check :::
  {% if printer['filament_switch_sensor toolhead_filament_sensor'].filament_detected %}   # Check if filemant sensor is detecting a filament.
    M117 Filament detected. Starting the unloading process.
    { action_respond_info("Filament detected. Starting the unloading process.") }
    _status_bar PS="progress"

    ################################
    # ::: Prepare loading :::
    #SAVE_GCODE_STATE NAME=unload_filament   # Save current settings. Will be restored at the end of the script.

    ################################
    # ::: FILAMENTCHANGE yes :::
    {% if MODE =="FILAMENTCHANGE" %}
      {% if ('x' not in printer.toolhead.homed_axes|lower or 'y' not in printer.toolhead.homed_axes|lower or 'z' not in printer.toolhead.homed_axes|lower) and allow_home == Flase %}  
        M117 UNLOAD_FILAMENT: X,Y or Z axis not homed and varaible allow_home is False. Printer PAUSE
        { action_respond_info("UNLOAD_FILAMENT: X,Y or Z axis not homed and varaible allow_home is False. Printer PAUSE") }
        PAUSE
        _status_bar PS="error"
      {% else %}  # homing needed & allowed
        {% if printer.pause_resume.is_paused == False and SPEED == 0 %}     # Only self-pause if printer is not already paused AND caller didn't pass SPEED>0
          { action_respond_info("pausing") }
          PAUSE     # Calls the Klipper PAUSE macro
          G4 P1000
        {% endif %} 
      {% endif %}

      SAVE_GCODE_STATE NAME=unload_filament   # Save current settings. Will be restored at the end of the script.

      M117 UNLOAD_FILAMENT: Move toolhead 
      G91
      G1 Z5    # Lifting nozzle by 5mm. To cleare from bed
      G90

      M104 S{NOZZLE_TEMP}   # Start heating nozzle to save time later.

      G90
      G1 X{toolhead_purging_position_x} Y{toolhead_purging_position_y} F3600    # move toolhead to pruging position, XY only

    ################################
    # ::: FILAMENTCHANGE no :::
    {% else %}  # FILAMENTCHANGE no
      {% if 'xy' not in printer.toolhead.homed_axes|lower %}                  # When in mid Print, axis should be homed. During Print start, nothing is homed at the point of PAUSE.
        M117 LOAD_FILAMENT: Homing needed. Calling G28 X Y
        { action_respond_info("LOAD_FILAMENT: Homing needed. Calling: G28 X Y") }
        G28                                                              # If X or Y not homed, all axis X,Y,Z will be homed. Even if G28 X Y is called.
        { action_respond_info("z%f " %  printer.toolhead.position.z) }
      {% endif %}

      SAVE_GCODE_STATE NAME=unload_filament   # Save current settings. Will be restored at the end of the script.

      M117 UNLOAD_FILAMENT: Move toolhead 
      G91
      G1 Z5    # Lifting nozzle by 5mm. To cleare from bed
      G90

      M104 S{NOZZLE_TEMP}   # Start heating nozzle to save time later.

      G90
      G1 X{toolhead_purging_position_x} Y{toolhead_purging_position_y} Z{poop_height_z} F3600    # move toolhead to pruging position, including Z height
    {% endif %} # FILAMENTCHANGE no

    ################################
    # ::: FILAMENTCHANGE no :::
    M117 UNLOAD_FILAMENT: Waiting for nozzle reaching target temperature
    M109 S{NOZZLE_TEMP}

    M106 S50  # Turn on the part cooling fan

    # Loading filament
    M117 UNLOAD_FILAMENT: Unloading Filament

    G91                   # Use relative coordinates for move commands
    M83                   # Put the extruder into relative mode
    G92 E0.0              # Set position pf extruder to 0 - Tell Klipper taht the current position of the extruder is 0.

    M117 UNLOAD_FILAMENT: Prepare forming tip on filament
    G0 E-5 F2000          # Extract a bit
    G0 E5 F300            # Move filament back in
      
    G0 E-30 F3000         # Forming filament Tip for Rapido -> from ERCF V3 ercf_software.cfg
  
    M117 UNLOAD_FILAMENT: Forming tip on filament
    G0 E2 F300            # Move filament in
    G0 E-2 F300           # Move filament out
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
    G0 E-2 F300
    G0 E2 F300
      
    M117 UNLOAD_FILAMENT: Unloading filament
    G0 E-40 F1800         # Puke filament out fast

    G92 E0.0              # Set position of extruder to 0
    M82                   # Put the extruder into absolute mode.
    G90                   # Use absolute coordinates for move commands

    # Preventing filament sticking to the nozzle.
    M104 S0     # Turn off nozzle heater
    M106 S127   # Use part cooling to harden the material. Not 255=100% because filament drys too fast.
    G4 P5000    # Wait 5 seconds
    M107        # Stop part cooling fan

    {% if MODE =="FILAMENTCHANGE" %}  # Need to decide if there is a difference...
      RESTORE_GCODE_STATE NAME=unload_filament MOVE=1
    {% else %}
      RESTORE_GCODE_STATE NAME=unload_filament MOVE=1
    {% endif %}

    M117 UNLOAD_FILAMENT: Complete. Filament can now be removed.


  {% else %}
    M117 No filament detected. Nothing to unload.
    { action_respond_info("No filament detected. Nothing to unload.") }
  {% endif %}
  _status_bar PS="idle"
