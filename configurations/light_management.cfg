[gcode_macro _status_bar_white]
description: off
# Behavior: Turn the light white
# Explanation: -:-
gcode:

##############################################
[gcode_macro _status_bar_off]
description: off
# Behavior: Turn the light off
# Explanation: -:-
gcode:


################################################################################################
[delayed_gcode _status_bar_delayed_off]
#description: If called, the status light will turn off after the provided amount of time
# Call with: UPDATE_DELAYED_GCODE ID=_status_bar_delayed_off DURATION=300    # Schedule chamber light to turn off after 5 minutes (300s)
# Cancel with: #UPDATE_DELAYED_GCODE ID=_status_bar_delayed_off DURATION=0  # Cancel any pending status bard delayed off
gcode:
    _status_bar_off

##############################################
[delayed_gcode _status_bar_delayed_idle]
#description: If called, the status bard will change to idle after the provided amount of time
# Call with: UPDATE_DELAYED_GCODE ID=_status_bar_delayed_idle DURATION=3600    # Schedule chamber light to turn off after 60 minutes (3600s)
# Cancel with: #UPDATE_DELAYED_GCODE ID=_status_bar_delayed_idle DURATION=0  # Cancel any pending status bard delayed off
gcode:
    _status_bar_idle

