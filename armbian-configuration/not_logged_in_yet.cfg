#/root/.not_logged_in_yet

# Network Settings
PRESET_NET_CHANGE_DEFAULTS="0"
## Ethernet
PRESET_NET_ETHERNET_ENABLED="1"     #   ETH is ignored if WiFi is set active (1)
## WifFi
PRESET_NET_WIFI_ENABLED="0"
PRESET_NET_WIFI_SSID="<ssid>"
PRESET_NET_WIFI_PSK="<wpa_psk>"
PRESET_NET_WIFI_COUNTRYCODE="DE"
## Static IP
PRESET_NET_USE_STATIC="0"
PRESET_NET_STATIC_IP="192.168.11.123"
PRESET_NET_STATIC_MASK="255.255.255.0"
PRESET_NET_STATIC_GATEWAY="192.168.11.2"
PRESET_NET_STATIC_DNS="8.8.8.8 8.8.4.4"

# System
SET_LANG_BASED_ON_LOCATION="n"
PRESET_LOCALE="en_GB.UTF-8"
PRESET_TIMEZONE="Europe/Berlin"

# Accounts
## Root
PRESET_ROOT_PASSWORD="<root_password>"
PRESET_ROOT_KEY=""
## User
PRESET_USER_NAME="<username>"
PRESET_USER_PASSWORD="<user_password>"
PRESET_USER_KEY=""
PRESET_DEFAULT_REALNAME="<real_user_name>"
PRESET_USER_SHELL="bash"